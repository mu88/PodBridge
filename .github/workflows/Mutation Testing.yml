name: Mutation Testing

# Temporarily disabled (2026-08-27): mutation testing runs are taking excessively long / timing out
# (root cause not yet confirmed - see "fix-mutation-testing" todo). Switched to manual-only trigger
# until the underlying issue is fixed; re-enable the push trigger afterwards.
on:
  workflow_dispatch:

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build

      - name: Run mutation testing
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          dotnet tool run dotnet-stryker \
            --dashboard-api-key "$STRYKER_DASHBOARD_API_KEY" \
            --version "${{ github.ref_name }}" \
            --output ${{ runner.temp }}/Stryker/

      - name: Archive mutation testing results
        uses: actions/upload-artifact@v4
        with:
          name: mutation-testing-report
          path: ${{ runner.temp }}/Stryker/**/*.*
