name: Combined CI / Release / Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the resulting image to Hostim.dev after a successful build'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - '**'

jobs:
  shared_ci_cd:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    uses: mu88/common/.github/workflows/ci-cd.yml@2065d9a2f13eb5784433ac5bfc60e9a4df4ef9a5
    with:
      docker-attest-provenance-and-sbom: true
      docker-publish-project: src/PodBridge.Api/PodBridge.Api.csproj
      requires-docker-login: true
      sonar-key: mu88_PodBridge
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: 'Deploy to Hostim.dev'
    needs:
      - shared_ci_cd
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true) ||
      (github.event_name == 'push' && needs.shared_ci_cd.outputs.is_release == 'true')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      packages: read

    steps:
      - name: Login to Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine container image to deploy
        id: determine-image
        shell: pwsh
        env:
          IMAGE_NAMES: ${{ needs.shared_ci_cd.outputs.image_names }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $imageNames = $env:IMAGE_NAMES | ConvertFrom-Json
          # PodBridge only publishes the chiseled container family (see PublishChiseledContainer in
          # PodBridge.Api.csproj) - pick it explicitly by name instead of assuming array position/count,
          # so this keeps working if a second family is ever added.
          $chiseledImage = $imageNames | Where-Object { $_ -like '*-chiseled' } | Select-Object -First 1
          if (-not $chiseledImage) {
            throw "No chiseled image found among generated images: $($imageNames -join ', ')"
          }

          # PodBridge publishes a multi-arch image (linux-x64 + linux-arm64, see RuntimeIdentifiers in
          # PodBridge.Api.csproj), so the shared workflow's digests output mixes per-platform manifest
          # digests with the manifest-list digest and isn't keyed to a specific tag - not reliable to
          # consume here (order/count aren't a documented contract). Resolve the manifest-list digest for
          # this exact tag directly instead, using the same technique the shared workflow uses internally.
          docker pull $chiseledImage
          $repoDigest = docker inspect --format='{{index .RepoDigests 0}}' $chiseledImage
          if ($repoDigest -notmatch '@(sha256:[a-f0-9]{64})$') {
            throw "Could not determine digest for '$chiseledImage' from RepoDigests: $repoDigest"
          }

          $fullyQualifiedImage = "$chiseledImage@$($Matches[1])"
          Write-Host "Determined container image to deploy: $fullyQualifiedImage"
          Write-Output "image=$fullyQualifiedImage" >> $env:GITHUB_OUTPUT

      # This step currently fails with "HTTP 400: Error at '/domains': Value is not nullable" for apps
      # without a custom domain configured - tracked upstream at
      # https://github.com/hostimdev/action/issues/2. Remove this comment once that's resolved.
      - name: Deploy to Hostim.dev
        uses: hostimdev/action@v2
        with:
          api_token: ${{ secrets.HOSTIM_DEV_API_TOKEN }}
          project: ${{ vars.HOSTIM_DEV_PROJECT_ID }}
          app: ${{ vars.HOSTIM_DEV_APP_NAME }}
          image: ${{ steps.determine-image.outputs.image }}
