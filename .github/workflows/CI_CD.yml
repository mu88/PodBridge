name: Combined CI / Release / Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the resulting image to Hostim.dev after a successful build'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - '**'

jobs:
  shared_ci_cd:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    uses: mu88/common/.github/workflows/ci-cd.yml@2065d9a2f13eb5784433ac5bfc60e9a4df4ef9a5
    with:
      docker-attest-provenance-and-sbom: true
      docker-publish-project: src/PodBridge.Api/PodBridge.Api.csproj
      requires-docker-login: true
      sonar-key: mu88_PodBridge
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: 'Deploy to Hostim.dev'
    needs:
      - shared_ci_cd
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true) ||
      (github.event_name == 'push' && needs.shared_ci_cd.outputs.is_release == 'true')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions: {}

    steps:
      - name: Determine container image to deploy
        id: determine-image
        shell: pwsh
        env:
          IMAGE_NAMES: ${{ needs.shared_ci_cd.outputs.image_names }}
          DIGESTS: ${{ needs.shared_ci_cd.outputs.digests }}
        run: |
          $imageNames = $env:IMAGE_NAMES | ConvertFrom-Json
          # PodBridge only publishes the chiseled container family (see PublishChiseledContainer in
          # PodBridge.Api.csproj) - pick it explicitly by name instead of assuming array position/count,
          # so this keeps working if a second family is ever added.
          $chiseledImage = $imageNames | Where-Object { $_ -like '*-chiseled' } | Select-Object -First 1
          if (-not $chiseledImage) {
            throw "No chiseled image found among generated images: $($imageNames -join ', ')"
          }

          # PodBridge publishes exactly one family/platform, so the shared workflow's digests output
          # (not keyed to a specific tag) is expected to contain exactly one entry - the chiseled image's
          # own digest. Assert this explicitly rather than silently guessing wrong if that ever changes.
          $digests = $env:DIGESTS | ConvertFrom-Json
          if (@($digests).Count -ne 1) {
            throw "Expected exactly one digest for the single published container family, but got: $($digests -join ', ')"
          }
          $digest = @($digests)[0]

          $fullyQualifiedImage = "$chiseledImage@$digest"
          Write-Host "Determined container image to deploy: $fullyQualifiedImage"
          Write-Output "image=$fullyQualifiedImage" >> $env:GITHUB_OUTPUT

      - name: Deploy to Hostim.dev
        uses: hostimdev/action@v2
        with:
          api_token: ${{ secrets.HOSTIM_DEV_API_TOKEN }}
          project: ${{ vars.HOSTIM_DEV_PROJECT_ID }}
          app: ${{ vars.HOSTIM_DEV_APP_NAME }}
          image: ${{ steps.determine-image.outputs.image }}
