name: Combined CI / Release / Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: 'Deploy the resulting image to Azure Container Apps after a successful build'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - '**'

jobs:
  validate_infra:
    name: 'Validate infrastructure'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Pester tests for infra PowerShell scripts
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -MinimumVersion 5.0.0
          Import-Module Pester -MinimumVersion 5.0.0
          $result = Invoke-Pester -Path ./infra -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed."
          }

      - name: Build Bicep template
        # Compiles infra/main.bicep to ARM JSON without deploying anything: catches syntax errors, invalid
        # apiVersions and missing required resource properties. Needs no Azure credentials, so it also runs
        # safely on Renovate PRs that bump a resource's apiVersion.
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: az bicep build --file infra/main.bicep --stdout

  shared_ci_cd:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    uses: mu88/common/.github/workflows/ci-cd.yml@71491294b6cedc0b81ba1e440ece25aba0fbb85e
    with:
      docker-attest-provenance-and-sbom: true
      docker-publish-project: src/PodBridge.Api/PodBridge.Api.csproj
      requires-docker-login: true
      sonar-key: mu88_PodBridge
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: 'Deploy to Azure Container Apps'
    needs:
      - shared_ci_cd
      - validate_infra
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_azure == true) ||
      (github.event_name == 'push' && needs.shared_ci_cd.outputs.is_release == 'true')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Merge PodBridge config variable with Auth secrets
        shell: pwsh
        env:
          PODBRIDGE_CONFIG_JSON: ${{ vars.PODBRIDGE_CONFIG_JSON }}
          PODBRIDGE_AUTH_USERNAME: ${{ secrets.PODBRIDGE_AUTH_USERNAME }}
          PODBRIDGE_AUTH_PASSWORD: ${{ secrets.PODBRIDGE_AUTH_PASSWORD }}
        run: |
          $config = $env:PODBRIDGE_CONFIG_JSON | ConvertFrom-Json -AsHashtable
          $config.PodBridge.Auth.Username = $env:PODBRIDGE_AUTH_USERNAME
          $config.PodBridge.Auth.Password = $env:PODBRIDGE_AUTH_PASSWORD
          $mergedConfigJson = $config | ConvertTo-Json -Depth 10
          # Written to RUNNER_TEMP (outside the checkout) so the secret-laden file can never be
          # picked up by a later artifact-upload or cache step operating on the workspace.
          ./infra/Convert-ConfigToSecretFiles.ps1 -ConfigJson $mergedConfigJson -OutputPath "${{ runner.temp }}/secret-files.json"

      - name: Determine container image to deploy
        id: determine-image
        shell: pwsh
        env:
          IMAGE_NAMES: ${{ needs.shared_ci_cd.outputs.image_names }}
        run: |
          $imageNames = $env:IMAGE_NAMES | ConvertFrom-Json
          # PodBridge only publishes the chiseled container family (see PublishChiseledContainer in
          # PodBridge.Api.csproj) - pick it explicitly by name instead of assuming array position/count,
          # so this keeps working if a second family is ever added.
          $chiseledImage = $imageNames | Where-Object { $_ -like '*-chiseled' } | Select-Object -First 1
          if (-not $chiseledImage) {
            throw "No chiseled image found among generated images: $($imageNames -join ', ')"
          }

          Write-Host "Determined container image to deploy: $chiseledImage"
          Write-Output "image=$chiseledImage" >> $env:GITHUB_OUTPUT

      - name: Deploy Bicep template
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            az deployment group create \
              --name "podbridge-${{ github.run_id }}" \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters containerImage=${{ steps.determine-image.outputs.image }} secretFilesConfig=@${{ runner.temp }}/secret-files.json
